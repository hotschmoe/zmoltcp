name: CI

on:
  push:
    branches: [master, dev-hotschmoe]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  version-check:
    name: Version Bump Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check version bump
        run: |
          PR_VERSION=$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon)
          git fetch origin master
          MASTER_VERSION=$(git show origin/master:build.zig.zon | sed -n 's/.*\.version = "\([^"]*\)".*/\1/p')
          echo "PR version:     $PR_VERSION"
          echo "Master version: $MASTER_VERSION"
          if [ "$PR_VERSION" = "$MASTER_VERSION" ]; then
            echo "::error::Version not bumped. Update .version in build.zig.zon before merging."
            exit 1
          fi
          echo "Version bump verified: $MASTER_VERSION -> $PR_VERSION"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: true
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Run test matrix (all modes, ghost on/off, cross checks)
        run: zig build matrix --summary all

      - name: Run demos
        run: zig build demo

      - name: Phase 0 gate (every classified function executed by a law or scenario)
        run: zig build assurance

      - name: Z3 (pinned release, checked against its digest)
        run: echo "ZV_Z3=$(sh scripts/install_z3.sh "$RUNNER_TEMP/z3")" >> "$GITHUB_ENV"

      - name: Verifier (every .verified function proved from the checked-in AIR packs)
        run: zig build verify

      - name: Ownership (every function of the checked-in AIR pack is clean; the seeded mistakes are found)
        run: zig build own own-seeded

      - name: Cross-compile check (aarch64-freestanding)
        run: zig build -Dtarget=aarch64-freestanding-none

  interop:
    name: Interop with smoltcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Run interop scenarios
        run: zig build interop --summary all

      - name: Probe smoltcp with the segments behind the TCP fixes
        run: zig build interop-upstream --summary all
